[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runvouch"
version = "0.3.3"
description = "The watchdog for unattended AI agents: dead man's switch, cost cap and outcome check for cron'd LLM scripts, Claude Code routines, OpenClaw and n8n."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "RunVouch", email = "hello@runvouch.com"}]
keywords = ["ai-agents", "monitoring", "watchdog", "cron", "llm", "claude-code", "openclaw", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://runvouch.com"
Documentation = "https://runvouch.com/docs"
Source = "https://github.com/runvouch/runvouch"

[project.scripts]
rv = "runvouch.cli:main"
runvouch = "runvouch.cli:main"

[tool.setuptools]
packages = ["runvouch"]
