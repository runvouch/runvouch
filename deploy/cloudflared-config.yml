tunnel: runvouch
credentials-file: ~/.cloudflared/runvouch.json   # absolute path of the tunnel credentials on the host
ingress:
  - hostname: api.runvouch.com
    service: http://127.0.0.1:8787
  - hostname: runvouch.com
    service: http://127.0.0.1:8787
  - hostname: www.runvouch.com
    service: http://127.0.0.1:8787
  - service: http_status:404
